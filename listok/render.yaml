# Render Blueprint: Render -> New -> Blueprint -> вибрати репозиторій.
# Створює один вебсервіс на безкоштовному тарифі (PaaS).
services:
  - type: web
    name: listok-plants
    runtime: python
    plan: free
    region: frankfurt            # найближчий до України регіон
    buildCommand: pip install -r requirements.txt
    # 1 процес + 4 потоки: вистачає для демо і вкладається в 512 МБ пам'яті безкоштовного тарифу.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false              # значення вводиться вручну в панелі Render
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-3.5-flash-lite,gemini-2.5-flash
      - key: GEMINI_PRO_MODEL
        value: gemini-2.5-pro
      - key: FLASK_SECRET_KEY
        generateValue: true
